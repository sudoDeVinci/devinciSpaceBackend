<style>
    body {
        margin: 0;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
    }

    .page-container {
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        height: 100vh;
        width: 100%;
    }

    .container {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
    }

    .big-holder {
        position: relative;
        max-height: 80vh;
        width: 100%
    }

    #screen {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: black;
        opacity: 1;
        image-rendering: pixelated;
    }

    .controls {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        flex-wrap: wrap !important;
        gap: 10px !important;
        user-select: none !important;
        width: 100% !important;
        padding: 10px !important;
        background: rgba(0, 0, 0, 0.8) !important;
        z-index: 9999 !important;
        position: relative !important;
        box-sizing: border-box !important;
        flex-grow: 1;
        height: 100%;
    }
    
    .controls button {
        min-width: 40px !important;
        min-height: 40px !important;
        max-width: 50px !important;
        max-height: 50px !important;
        font-size: 12px !important;
    }
    
    .left-controls {
        gap: 8px !important;
    }
    
    .arrow-row {
        gap: 3px !important;
    }

    .arrow-row.ar-top {
        margin-left: 35%;
    }


</style>

<title>Welcome!</title>
<body>
    <div class="page-container">
        <div class="container">
            <div class="big-holder">
                <div id="gradientScreen"></div>
                <canvas id="screen" tabindex="0"></canvas>
            </div>
        </div>
        <div class="controls">
            <div class="left-controls">
                <button id="enterButton" aria-label="Enter">&#x23CE;</button>
                <button id="ctrlButton">Ctrl</button>
                <button id="spaceButton">Space</button>
                <button id="altButton">Alt</button>
            </div>

            <div class="arrow-controls">
                <div class="arrow-row ar-top">
                <span class="arrow-spacer"></span>
                <button id="upButton" aria-label="up">&#x2191;</button>
                <span class="arrow-spacer"></span>
            </div>
            <div class="arrow-row bottom">
                <button id="leftButton" aria-label="left">&#x2190;</button>
                <button id="downButton" aria-label="down">&#x2193;</button>
                <button id="rightButton" aria-label="right">&#x2192;</button>
            </div>
        </div>
    </div>
</body>
<script type="module" src="/js/doom.js"></script>
